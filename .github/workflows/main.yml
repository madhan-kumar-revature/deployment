name: Deploy Service

run-name: ${{ github.event.client_payload.commit_sha }}

on:
  repository_dispatch:
    types: [deploy]

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: madhan-kumar-revature/${{ github.event.client_payload.app_name }}
          ref: ${{ github.event.client_payload.commit_sha }}

      - name: Build
        run: echo "Building..."

  Deploy-Dev:
    runs-on: ubuntu-latest
    needs: Build

    steps:
      - run: echo "Deploying to Dev"

  Deploy-QA:
    runs-on: ubuntu-latest
    needs: Deploy-Dev

    steps:
      - run: echo "Deploying to QA"
