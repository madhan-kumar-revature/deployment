name: Deploy Service
run-name: ${{ github.event.inputs.app_name }} || ${{ github.event.inputs.commit_sha }}

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      commit_sha:
        required: true
        type: string

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo at specific commit
        uses: actions/checkout@v4
        with:
          repository: madhan-kumar-revature/${{ inputs.app_name }}
          ref: ${{ inputs.commit_sha }}

      - name: Listing Files
        run: | 
          ls -al
        
      - name: Build Docker Image
        run: echo "Building the application..."
      
