name: Deploy Service
run-name: ${{ github.event.client_payload.commit_sha }}

on:
  repository_dispatch:
    types: [deploy]

jobs:

  # 🔄 SET STATUS → PENDING
  Set-Status-Pending:
    runs-on: ubuntu-latest
    steps:
      - name: Mark deployment as pending
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/madhan-kumar-revature/${{ github.event.client_payload.app_name }}/statuses/${{ github.event.client_payload.commit_sha }} \
            -d '{
              "state": "pending",
              "context": "deployment",
              "description": "Deployment started",
              "target_url": "https://github.com/madhan-kumar-revature/deployment/actions/runs/${{ github.run_id }}"
            }'

  # 🏗 BUILD
  Build:
    runs-on: ubuntu-latest
    needs: Set-Status-Pending

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: madhan-kumar-revature/${{ github.event.client_payload.app_name }}
          ref: ${{ github.event.client_payload.commit_sha }}

      - name: Build
        run: echo "Building application..."

  # 🚀 DEPLOY DEV
  Deploy-Dev:
    runs-on: ubuntu-latest
    needs: Build
    if: github.event.client_payload.deploy_dev == true

    steps:
      - name: Deploy to Dev
        run: echo "Deploying to Dev environment..."

  # 🧪 DEPLOY QA
  Deploy-QA:
    runs-on: ubuntu-latest
    needs: Deploy-Dev
    environment: Qa
    if: github.event.client_payload.deploy_qa == true

    steps:
      - name: Deploy to QA
        run: echo "Deploying to QA environment..."

  # ✅ FINAL STATUS (SUCCESS / FAILURE)
  Final-Status:
    runs-on: ubuntu-latest
    needs: [Build, Deploy-Dev, Deploy-QA]
    if: always()

    steps:
      - name: Set SUCCESS status
        if: ${{ needs.Build.result == 'success' && (needs.Deploy-Dev.result == 'success' || needs.Deploy-Dev.result == 'skipped') && (needs.Deploy-QA.result == 'success' || needs.Deploy-QA.result == 'skipped') }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/madhan-kumar-revature/${{ github.event.client_payload.app_name }}/statuses/${{ github.event.client_payload.commit_sha }} \
            -d '{
              "state": "success",
              "context": "deployment",
              "description": "Deployment successful",
              "target_url": "https://github.com/madhan-kumar-revature/deployment/actions/runs/${{ github.run_id }}"
            }'

      - name: Set FAILURE status
        if: ${{ failure() }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/madhan-kumar-revature/${{ github.event.client_payload.app_name }}/statuses/${{ github.event.client_payload.commit_sha }} \
            -d '{
              "state": "failure",
              "context": "deployment",
              "description": "Deployment failed",
              "target_url": "https://github.com/madhan-kumar-revature/deployment/actions/runs/${{ github.run_id }}"
            }'
