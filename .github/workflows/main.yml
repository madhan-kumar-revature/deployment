name: Deploy Service
run-name: ${{ github.event.client_payload.app_name }} || ${{ github.event.client_payload.commit_sha }}

on:
  repository_dispatch:
    types: [deploy]

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: madhan-kumar-revature/${{ github.event.client_payload.app_name }}
          ref: ${{ github.event.client_payload.commit_sha }}

      - run: echo "Building..."

  Deploy-Dev:
    name: Devploy to Dev
    runs-on: ubuntu-latest
    needs: Build
    if: github.event.client_payload.deploy_dev == true
    environment: Dev
    steps:
      - run: echo "Deploying to Dev"

  Deploy-Qa:
    name: Deploy to Qa
    runs-on: ubuntu-latest
    needs: Deploy-Dev
    if: github.event.client_payload.deploy_qa == true
    environment: Qa
    steps:
      - run: echo "Deploying to QA"

  Deploy-Staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: Deploy-Qa
    environment: Staging
    steps:
      - run: echo "Deploying to Staging"

  Deploy-Prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: Deploy-Staging
    environment: Prod
    steps:
      - run: echo "Deploying to Prod"
      
